spring.application.name=api-gateway
server.port=${PORT:8080}

# Global CORS Configuration (Moved to CorsConfig.java)
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
# Eureka Client Discovery Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# JWT Secret
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}

# Spring Cloud Gateway Routing Configuration
# 1. Auth Service Routes (Registration & Login - Public)
spring.cloud.gateway.routes[0].id=auth-service-public
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/login, /api/auth/register

# 2. Auth Service Routes (Admin Users - Protected)
spring.cloud.gateway.routes[1].id=auth-service-admin
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/admin/users/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthenticationFilter

# 3. Vehicle Service Routes (Protected)
spring.cloud.gateway.routes[2].id=vehicle-service
spring.cloud.gateway.routes[2].uri=lb://vehicle-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/vehicles/**, /api/admin/vehicles/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthenticationFilter

# 4. Reservation Service Routes (Protected)
spring.cloud.gateway.routes[3].id=reservation-service
spring.cloud.gateway.routes[3].uri=lb://reservation-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/reservations/**, /api/admin/reservations/**
spring.cloud.gateway.routes[3].filters[0]=JwtAuthenticationFilter

# 5. Payment Service Routes (Protected - Internal/Debugging)
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=lb://payment-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.routes[4].filters[0]=JwtAuthenticationFilter

# Allow Static Web Content to be served from Gateway on /
spring.web.resources.static-locations=classpath:/static/
