<div class="auth-page">
  <div class="auth-box">
    <!-- Brand -->
    <div class="auth-logo">
      <span class="logo-icon">🚗</span>
      <h1>VehicleRent</h1>
      <p>Premium Vehicle Rental Platform</p>
    </div>

    <!-- Tab switcher -->
    <div class="auth-tabs">
      <button id="tab-login" 
              class="auth-tab" 
              [class.active]="activeTab === 'login'"
              (click)="showLogin()">
        Sign In
      </button>
      <button id="tab-register" 
              class="auth-tab" 
              [class.active]="activeTab === 'register'"
              (click)="showRegister()">
        Register
      </button>
    </div>

    <!-- Login Panel -->
    <div id="login-panel" class="auth-panel" [class.active]="activeTab === 'login'">
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" 
               id="login-email" 
               placeholder="you@example.com" 
               autocomplete="email"
               [(ngModel)]="loginEmail">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" 
               id="login-password" 
               placeholder="••••••••"
               autocomplete="current-password" 
               [(ngModel)]="loginPassword"
               (keydown.enter)="login()">
      </div>
      <button id="login-btn" 
              class="btn btn-primary btn-full" 
              [disabled]="isLoggingIn"
              (click)="login()">
        {{ isLoggingIn ? 'Signing in…' : 'Sign In' }}
      </button>
      <p style="text-align:center;margin-top:1rem;font-size:0.85rem;color:var(--text-2)">
        Default admin: <code style="color:var(--accent)">admin@vehiclerental.com</code> /
        <code style="color:var(--accent)">admin123</code>
      </p>
    </div>

    <!-- Register Panel -->
    <div id="register-panel" class="auth-panel" [class.active]="activeTab === 'register'">
      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" 
               id="reg-name" 
               placeholder="John Smith" 
               autocomplete="name"
               [(ngModel)]="regName">
      </div>
      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <input type="email" 
               id="reg-email" 
               placeholder="you@example.com" 
               autocomplete="email"
               [(ngModel)]="regEmail">
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" 
               id="reg-password" 
               placeholder="Min. 8 chars, A-Z, a-z, 0-9, special" 
               autocomplete="new-password"
               [(ngModel)]="regPassword">
        <small style="display:block;margin-top:0.35rem;font-size:0.78rem;color:var(--text-2)">
          Must have uppercase, lowercase, number &amp; special character (e.g. !@#$%)
        </small>
      </div>
      <div class="form-group">
        <label for="reg-license">Driver's License Number</label>
        <input type="text" 
               id="reg-license" 
               placeholder="DL-1234567890"
               [(ngModel)]="regLicense">
      </div>
      <button id="register-btn" 
              class="btn btn-primary btn-full" 
              [disabled]="isRegistering"
              (click)="register()">
        {{ isRegistering ? 'Creating account…' : 'Create Account' }}
      </button>
    </div>
  </div>
</div>
